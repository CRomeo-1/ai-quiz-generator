<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Quiz Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-slate-800">AI Quiz Generator</h1>
    <p class="text-slate-500 mb-6">Paste your study notes and get a quiz to test yourself.</p>

    <!-- input -->
    <div id="input-section" class="bg-white rounded-xl shadow p-5">
      <textarea id="notes" rows="8" class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        placeholder="Paste your notes here..."></textarea>
      <div class="flex items-center gap-3 mt-3">
        <label class="text-sm text-slate-600">Questions:</label>
        <select id="count" class="border rounded-lg p-2">
          <option>3</option><option selected>5</option><option>10</option>
        </select>
        <button id="generate" class="ml-auto bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg">Generate quiz</button>
      </div>
      <p id="error" class="text-red-600 text-sm mt-2"></p>
    </div>

    <!-- quiz -->
    <div id="quiz-section" class="hidden mt-6">
      <h2 id="quiz-title" class="text-xl font-semibold text-slate-800 mb-4"></h2>
      <div id="questions" class="space-y-4"></div>
      <button id="submit" class="mt-4 bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg">Check answers</button>
      <p id="result" class="text-lg font-semibold mt-3"></p>
    </div>

    <!-- history -->
    <div class="mt-10">
      <h2 class="text-lg font-semibold text-slate-700 mb-2">Previous quizzes</h2>
      <ul id="history" class="space-y-2"></ul>
    </div>
  </div>

  <script>
    let currentQuiz = null;

    async function generate() {
      const btn = document.getElementById("generate");
      document.getElementById("error").textContent = "";
      btn.disabled = true;
      btn.textContent = "Generating...";

      try {
        const res = await fetch("/api/quizzes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            notes: document.getElementById("notes").value,
            count: Number(document.getElementById("count").value),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showQuiz(data);
        loadHistory();
      } catch (err) {
        document.getElementById("error").textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate quiz";
      }
    }

    function showQuiz(quiz) {
      currentQuiz = quiz;
      document.getElementById("quiz-section").classList.remove("hidden");
      document.getElementById("quiz-title").textContent = quiz.title;
      document.getElementById("result").textContent = "";

      const container = document.getElementById("questions");
      container.innerHTML = "";
      quiz.questions.forEach((q, i) => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow p-4";

        const title = document.createElement("p");
        title.className = "font-medium mb-2";
        title.textContent = `${i + 1}. ${q.question}`;
        card.appendChild(title);

        q.options.forEach((opt, j) => {
          const label = document.createElement("label");
          label.className = "block p-2 rounded cursor-pointer hover:bg-slate-50";
          label.id = `q${i}o${j}`;
          const input = document.createElement("input");
          input.type = "radio";
          input.name = `q${i}`;
          input.value = j;
          input.className = "mr-2";
          label.appendChild(input);
          label.appendChild(document.createTextNode(opt));
          card.appendChild(label);
        });

        const exp = document.createElement("p");
        exp.className = "text-sm text-slate-500 mt-2 hidden";
        exp.id = `exp${i}`;
        exp.textContent = q.explanation || "";
        card.appendChild(exp);

        container.appendChild(card);
      });
    }

    async function checkAnswers() {
      let score = 0;
      currentQuiz.questions.forEach((q, i) => {
        const picked = document.querySelector(`input[name="q${i}"]:checked`);
        if (picked && Number(picked.value) === q.answer) score++;
        else if (picked) document.getElementById(`q${i}o${picked.value}`).classList.add("bg-red-100");
        document.getElementById(`q${i}o${q.answer}`).classList.add("bg-green-100");
        document.getElementById(`exp${i}`).classList.remove("hidden");
      });

      document.getElementById("result").textContent = `Score: ${score} / ${currentQuiz.questions.length}`;
      await fetch(`/api/quizzes/${currentQuiz.id}/score`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ score }),
      });
      loadHistory();
    }

    async function loadHistory() {
      const quizzes = await (await fetch("/api/quizzes")).json();
      const list = document.getElementById("history");
      list.innerHTML = "";
      quizzes.forEach((q) => {
        const li = document.createElement("li");
        li.className = "bg-white rounded-lg shadow px-4 py-2 flex justify-between cursor-pointer hover:bg-indigo-50";
        li.textContent = q.title;
        const span = document.createElement("span");
        span.className = "text-slate-500 text-sm";
        span.textContent = q.best_score === null ? "not taken" : `best: ${q.best_score}`;
        li.appendChild(span);
        li.onclick = async () => showQuiz(await (await fetch(`/api/quizzes/${q.id}`)).json());
        list.appendChild(li);
      });
    }

    document.getElementById("generate").onclick = generate;
    document.getElementById("submit").onclick = checkAnswers;
    loadHistory();
  </script>
</body>
</html>
